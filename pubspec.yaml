name: kaizen365
description: "Kaizen 365 — suivi d'objectifs annuels (OKR personnels)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.2
  flutter_localization: ^0.3.3
  flutter_timezone: ^5.1.1
  get_it: ^9.3.0
  home_widget: ^0.10.0
  intl: ^0.20.2
  material_symbols_icons: ^4.2960.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/bricolage_grotesque.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono.ttf
