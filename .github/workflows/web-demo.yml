name: Démo web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build the demo
        run: >
          flutter build web --release
          --base-href /Kaizen_365/
          --dart-define=KAIZEN_DEMO=true
          --no-web-resources-cdn

      - name: Repair the icon font
        run: |
          pip install fonttools
          python tool/resubset_icons.py

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
